<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jbird ~ terminal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
    <link rel="alternate" type="application/rss+xml" title="jbird's blog" href="posts/feed.xml">
</head>
<body>
    <!-- ========================================
         Desktop: Terminal UI
         ======================================== -->
    <div class="terminal desktop-only">
        <div class="crt-overlay" aria-hidden="true"></div>
        <canvas id="crt-noise" aria-hidden="true"></canvas>
        <div class="terminal-header">
            <span class="terminal-title">guest@jbird:~</span>
            <nav class="terminal-nav">
                <a href="#" class="terminal-nav-link" data-command="home">Home</a>
                <a href="#" class="terminal-nav-link" data-command="about">About</a>
                <a href="#" class="terminal-nav-link" data-command="work">Work</a>
                <a href="#" class="terminal-nav-link" data-command="blog">Blog</a>
                <a href="#" class="terminal-nav-link" data-command="contact">Contact</a>
            </nav>
        </div>
        
        <div class="terminal-body">
            <div id="output" class="terminal-output">
                <!-- Terminal output will be rendered here -->
            </div>
            
            <div class="terminal-input-line">
                <span class="prompt">guest@jbird:~$</span>
                <span id="input-mirror" class="input-mirror"></span><span id="cursor" class="cursor">█</span>
                <input type="text" id="terminal-input" class="terminal-input" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
            </div>
        </div>
    </div>

    <!-- ========================================
         Mobile: App UI (portrait-friendly)
         ======================================== -->
    <div class="mobile-app mobile-only">
        <!-- Intro + Nav + Content -->
        <div class="mobile-shell" id="mobile-shell">
            <main class="mobile-content">
                <section class="mobile-page active" id="page-home"></section>
                <section class="mobile-page" id="page-about"></section>
                <section class="mobile-page" id="page-work"></section>
                <section class="mobile-page" id="page-blog"></section>
                <section class="mobile-page" id="page-contact"></section>
            </main>

            <div class="command-pad" id="command-pad" aria-label="Site navigation">
                <div class="pad-prompt">
                    <span class="prompt">guest@jbird:~$</span>
                    <span class="pad-input-mirror" id="pad-mirror"></span><span class="pad-cursor" id="pad-cursor">█</span>
                </div>
                <div class="pad-keys" role="group">
                    <button type="button" class="pad-key active" data-page="home">home</button>
                    <button type="button" class="pad-key" data-page="about">about</button>
                    <button type="button" class="pad-key" data-page="work">work</button>
                    <button type="button" class="pad-key" data-page="contact">contact</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/pages.js"></script>
    <script src="js/intro.js"></script>
    <script src="js/blog.js"></script>
    <script src="js/terminal.js"></script>
    <script src="js/mobile.js"></script>
    <script src="js/contact.js"></script>
</body>
</html>
